<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>의장대에서 살아남기 — 육군 의장대 신병 가이드북</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <style>
        :root {
            /* 육군 의장대 시그니처 컬러 팔레트: 딥그린(메인) + 골드 & 화이트(포인트) */
            --bg-dark-green: #0c261a;
            --primary-deep: #113826;
            --primary-color: #174932;
            --primary-mid: #1f5c40;
            --primary-soft: #eef4f0;
            --primary-tint: #f6f9f7;

            --accent-color: #d4af37;
            --accent-bright: #f3d46b;
            --accent-deep: #9e7a18;
            --accent-soft: #fcf7e6;

            --pure-white: #ffffff;
            --text-main: #18241d;
            --text-sub: #4c5d53;
            --text-muted: #76877d;

            --gold-gradient: linear-gradient(135deg, #b88a28 0%, #f5df8b 35%, #d4af37 55%, #fff1b8 78%, #9e7318 100%);
            --green-hero-gradient: linear-gradient(160deg, #0b2217 0%, #143d29 52%, #1b4f36 100%);
            --player-bg: linear-gradient(165deg, #102e20 0%, #091a12 65%, #050f0a 100%);
            --card-shadow: 0 12px 30px rgba(10, 34, 23, 0.1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background: linear-gradient(180deg, #0d291c 0%, #133927 280px, #eff4f1 280px, #eff4f1 100%);
            color: var(--text-main);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gold-gradient);
            z-index: 100;
        }

        .app-container {
            width: 100%;
            max-width: 680px;
            padding: 20px 16px 40px;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- 메인 히어로 영역 --- */
        .hero-card {
            width: 100%;
            background: var(--green-hero-gradient);
            border-radius: 24px;
            padding: 32px 24px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 16px 36px rgba(7, 24, 16, 0.25);
            border: 1px solid rgba(212, 175, 55, 0.3);
            transition: all 0.4s ease;
            margin-top: 10px;
        }

        .hero-card::before {
            content: '';
            position: absolute;
            inset: 8px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
        }

        .unit-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.5);
            color: var(--accent-bright);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            margin-bottom: 16px;
            z-index: 1;
        }

        .unit-pill-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-bright);
            box-shadow: 0 0 8px var(--accent-bright);
        }

        .mark-container {
            width: 110px;
            height: 116px;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mark-glow {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.2) 0%, transparent 70%);
        }

        .mark-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
        }

        .main-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0 0 20px 0;
            text-align: center;
            color: var(--pure-white);
            letter-spacing: -0.5px;
            z-index: 1;
        }

        .gold-divider {
            width: 60px;
            height: 3px;
            border-radius: 999px;
            background: var(--gold-gradient);
            margin-bottom: 20px;
            z-index: 1;
        }

        .motto-strip {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--pure-white);
            font-size: 0.9rem;
            font-weight: 600;
            z-index: 1;
        }

        /* --- 메인 메뉴 카드 버튼 --- */
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            margin-top: 16px;
            transition: all 0.4s ease;
        }

        .menu-btn {
            background: var(--pure-white);
            border: 1px solid rgba(23, 73, 50, 0.1);
            color: var(--primary-deep);
            padding: 16px;
            border-radius: 18px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: var(--card-shadow);
            display: flex;
            align-items: center;
            text-align: left;
            gap: 14px;
            position: relative;
            overflow: hidden;
        }

        .menu-btn::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--gold-gradient);
        }

        .menu-btn-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--primary-soft);
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .menu-btn-text-wrap {
            flex: 1;
        }

        .menu-btn-label {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary-deep);
            margin-bottom: 2px;
        }

        .menu-btn-desc {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .menu-btn-count {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-deep);
            background: var(--accent-soft);
            padding: 4px 10px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .menu-btn:active {
            transform: scale(0.98);
        }

        /* --- 상세 화면 진입 시 전환 --- */
        .app-container.state-content-active .hero-card,
        .app-container.state-content-active .menu-container {
            display: none;
        }

        /* --- 컨텐츠 컨테이너 --- */
        .content-container {
            width: 100%;
            background: var(--pure-white);
            border-radius: 20px;
            padding: 0;
            box-shadow: 0 16px 36px rgba(10, 34, 23, 0.12);
            display: none;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.2);
            animation: slideUp 0.3s ease forwards;
        }

        .app-container.state-content-active .content-container {
            display: block;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 상세 페이지 헤더 */
        .content-header {
            background: var(--green-hero-gradient);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-color);
            position: relative;
        }

        .header-watermark {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            object-fit: contain;
            opacity: 0.1;
            pointer-events: none;
        }

        .content-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1;
        }

        .header-mini-mark {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .content-eyebrow {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--accent-bright);
            letter-spacing: 1px;
            display: block;
        }

        .content-title {
            font-size: 1.25rem;
            font-weight: 800;
            margin: 0;
            color: var(--pure-white);
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.15);
            color: var(--pure-white);
            border: none;
            padding: 8px 12px;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            z-index: 1;
        }

        .quick-nav-bar {
            display: flex;
            background: var(--primary-soft);
            padding: 8px 12px;
            overflow-x: auto;
            -ms-overflow-style: none;
            scrollbar-width: none;
            gap: 4px;
        }
        
        .quick-nav-bar::-webkit-scrollbar {
            display: none;
        }

        .quick-nav-pill {
            flex: 1;
            min-width: 90px;
            padding: 10px 8px;
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .quick-nav-pill.active {
            background: var(--pure-white);
            color: var(--primary-deep);
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .tab-badge {
            font-size: 0.7rem;
            background: var(--accent-color);
            color: var(--bg-dark-green);
            padding: 1px 6px;
            border-radius: 999px;
            font-weight: 800;
            display: none;
        }

        /* --- 글로벌 검색 바 --- */
        .global-search-container {
            padding: 14px 16px 0;
            background: var(--pure-white);
        }

        .global-search-wrap {
            position: relative;
        }

        .global-search-input {
            width: 100%;
            padding: 11px 14px 11px 38px;
            border-radius: 12px;
            border: 1.5px solid rgba(23, 73, 50, 0.2);
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            background: var(--primary-tint);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .global-search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(23, 73, 50, 0.1);
            background: var(--pure-white);
        }

        .global-search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
        }

        #content-body {
            padding: 16px;
        }

        .section-content {
            display: none;
        }

        .section-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 생활편 카테고리 칩 */
        .category-chips {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 6px;
            margin-bottom: 14px;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .category-chips::-webkit-scrollbar {
            display: none;
        }

        .cat-chip {
            border: 1px solid rgba(23, 73, 50, 0.15);
            background: var(--primary-tint);
            color: var(--text-sub);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
        }

        .cat-chip.active {
            background: var(--primary-color);
            color: var(--pure-white);
            border-color: var(--primary-color);
        }

        /* --- 공지 박스 --- */
        .notice-box {
            background: linear-gradient(135deg, #133c28 0%, #1b5238 100%);
            border-left: 4px solid var(--accent-color);
            padding: 14px 16px;
            margin-bottom: 16px;
            border-radius: 10px;
            color: var(--pure-white);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .notice-box-mark {
            width: 32px;
            height: 32px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .notice-box-label {
            font-size: 0.7rem;
            color: var(--accent-bright);
            font-weight: 800;
            margin-bottom: 2px;
        }

        .notice-box-text {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.4;
        }

        /* --- 리스트 스타일 --- */
        ol.custom-list {
            list-style: none;
            counter-reset: item;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        ol.custom-list > li {
            counter-increment: item;
            padding: 14px 14px 14px 46px;
            position: relative;
            line-height: 1.4;
            font-size: 0.9rem;
            color: var(--text-main);
            background: var(--pure-white);
            border: 1px solid rgba(23, 73, 50, 0.1);
            border-radius: 12px;
        }

        ol.custom-list > li::before {
            content: counter(item);
            position: absolute;
            left: 12px;
            top: 12px;
            width: 24px;
            height: 24px;
            background: var(--primary-color);
            color: var(--accent-bright);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 800;
        }

        .highlight {
            color: #7a5600;
            background: rgba(212, 175, 55, 0.15);
            padding: 2px 4px;
            border-radius: 4px;
            font-weight: 800;
        }

        ol.custom-list > li.is-highlight-row {
            background: #fffdf6;
            border: 1px solid rgba(212, 175, 55, 0.4);
        }

        ol.custom-list > li.is-highlight-row::before {
            background: var(--gold-gradient);
            color: var(--bg-dark-green);
        }

        .empty-filter-msg {
            display: none;
            text-align: center;
            padding: 30px 16px;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* --- 군가편 플레이어 --- */
        .song-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            background: var(--primary-soft);
            padding: 6px;
            border-radius: 12px;
            overflow-x: auto;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .song-selector::-webkit-scrollbar {
            display: none;
        }

        .song-tab {
            flex: 1;
            min-width: 80px;
            padding: 8px;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-sub);
            cursor: pointer;
            white-space: nowrap;
        }

        .song-tab.active {
            background: var(--primary-color);
            color: var(--pure-white);
        }

        .music-player-container {
            background: var(--player-bg);
            border-radius: 16px;
            padding: 24px 16px;
            color: var(--pure-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .player-emblem-badge {
            width: 48px;
            height: 48px;
            margin-bottom: 8px;
        }

        .player-emblem-badge img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .song-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin: 0 0 4px 0;
            color: var(--accent-bright);
            text-align: center;
        }

        .song-artist {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            margin-bottom: 12px;
        }

        .lyrics-helper-tip {
            font-size: 0.7rem;
            color: var(--accent-bright);
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 999px;
            margin-bottom: 12px;
        }

        .lyrics-container {
            width: 100%;
            height: 200px;
            overflow-y: auto;
            text-align: center;
            margin-bottom: 20px;
            padding: 10px 0;
            mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
            scroll-behavior: smooth;
        }
        
        .lyrics-container::-webkit-scrollbar {
            display: none;
        }

        .lyric-line {
            font-size: 0.9rem;
            font-weight: 600;
            margin: 14px 0;
            color: rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
            padding: 4px;
        }

        .lyric-line.active {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--accent-bright);
            transform: scale(1.05);
        }

        .lyric-line.search-hidden {
            display: none;
        }

        .player-controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 16px;
        }

        .progress-bar-bg {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            position: relative;
            cursor: pointer;
        }

        .progress-bar-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: var(--gold-gradient);
            border-radius: 999px;
            width: 0%;
            pointer-events: none;
        }

        .progress-bar-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: var(--pure-white);
            border-radius: 50%;
        }

        .play-btn {
            background: var(--gold-gradient);
            border: none;
            color: var(--bg-dark-green);
            width: 54px;
            height: 54px;
            border-radius: 50%;
            font-size: 1.4rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        
        .play-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div class="app-container" id="app">

    <!-- 메인 히어로 -->
    <div class="hero-card">
        <div class="unit-pill">
            <span class="unit-pill-dot"></span>
            <span>ROK ARMY HONOR GUARD</span>
        </div>

        <div class="mark-container">
            <div class="mark-glow"></div>
            <img class="mark-img" src="Code_Generated_Image.png" alt="대한민국 육군 의장대 마크" onerror="this.src='https://placehold.co/100x100/174932/d4af37?text=MARK'"/>
        </div>

        <h1 class="main-title">의장대에서 살아남기</h1>
        <div class="gold-divider"></div>

        <div class="motto-strip">
            <span>의식은 전투처럼 훈련은 실전같이</span>
        </div>
    </div>

    <!-- 메뉴 리스트 -->
    <div class="menu-container">
        <button class="menu-btn" onclick="openContent('life')">
            <div class="menu-btn-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </div>
            <div class="menu-btn-text-wrap">
                <div class="menu-btn-label">생활편</div>
                <div class="menu-btn-desc">관물대·복장·일과·점호</div>
            </div>
            <span class="menu-btn-count">31개 수칙</span>
        </button>

        <button class="menu-btn" onclick="openContent('training')">
            <div class="menu-btn-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            </div>
            <div class="menu-btn-text-wrap">
                <div class="menu-btn-label">행사/훈련편</div>
                <div class="menu-btn-desc">총기·행사복·군기·행진</div>
            </div>
            <span class="menu-btn-count">12개 수칙</span>
        </button>

        <button class="menu-btn" onclick="openContent('song')">
            <div class="menu-btn-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
            </div>
            <div class="menu-btn-text-wrap">
                <div class="menu-btn-label">군가편</div>
                <div class="menu-btn-desc">의장대 필수 군가 3곡</div>
            </div>
            <span class="menu-btn-count">가사 싱크</span>
