<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>의장대 가이드북 — Neumorphism</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <style>
        :root {
            /* 중간 톤 딥 포레스트 그린 */
            --forest-base: #113322;
            --forest-mid: #16402b;

            /* 뉴모피즘의 핵심: 톤이 정밀하게 조절된 상아/크림 베이스 */
            --neu-bg: #ece8dd;
            --neu-light: #ffffff;
            --neu-dark: #d2cdbe;

            /* 뉴모피즘 볼록 효과 (Emboss) */
            --neu-shadow: 8px 8px 18px var(--neu-dark), -8px -8px 18px var(--neu-light);
            --neu-shadow-sm: 5px 5px 12px var(--neu-dark), -5px -5px 12px var(--neu-light);
            --neu-inset: inset 4px 4px 8px var(--neu-dark), inset -4px -4px 8px var(--neu-light);

            /* 골드 포인트 */
            --accent-gold: #c29d38;
            --accent-gold-light: #f5e4a8;
            --gold-gradient: linear-gradient(135deg, #af872a 0%, #edd887 45%, #c29d38 75%, #8f6a19 100%);

            --text-main: #18281f;
            --text-sub: #43544a;
            --text-muted: #74837a;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
            background-color: var(--neu-bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: var(--text-main);
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 640px;
            padding: 24px 18px 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* --- 인트로 오버레이 --- */
        #intro-overlay {
            position: fixed;
            inset: 0;
            background: var(--forest-base);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            transition: background-color 0.8s ease, opacity 0.6s ease;
        }

        .intro-emblem-wrap {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .intro-glow {
            position: absolute;
            inset: -25px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(194, 157, 56, 0.4) 0%, transparent 70%);
        }

        .intro-mark {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.45));
        }

        .intro-text {
            margin-top: 16px;
            font-size: 0.85rem;
            letter-spacing: 3px;
            color: var(--accent-gold);
            font-weight: 700;
            transition: opacity 0.3s;
        }

        /* --- 등장 애니메이션 --- */
        .hero-card, .menu-container {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body.intro-finished .hero-card {
            opacity: 1;
            transform: translateY(0);
        }

        body.intro-finished .menu-container {
            opacity: 1;
            transform: translateY(0);
            transition-delay: 0.12s;
        }

        /* --- 메인 히어로 카드 --- */
        .hero-card {
            width: 100%;
            background: linear-gradient(165deg, var(--forest-mid) 0%, var(--forest-base) 100%);
            border-radius: 26px;
            padding: 34px 24px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 10px 10px 24px var(--neu-dark), -10px -10px 24px var(--neu-light);
            border: 1px solid rgba(194, 157, 56, 0.28);
        }

        .unit-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(194, 157, 56, 0.35);
            color: var(--accent-gold-light);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 18px;
        }

        .unit-pill-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent-gold-light);
            box-shadow: 0 0 6px var(--accent-gold-light);
        }

        .mark-container {
            width: 90px;
            height: 96px;
            margin-bottom: 18px;
            position: relative;
        }

        .mark-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.35));
        }

        .main-title {
            font-size: 1.7rem;
            font-weight: 800;
            margin: 0 0 16px;
            color: #ffffff;
        }

        .gold-divider {
            width: 50px;
            height: 2px;
            background: var(--gold-gradient);
            margin-bottom: 16px;
            border-radius: 999px;
        }

        .motto-strip {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 18px;
            color: #e4ebe7;
            font-size: 0.86rem;
            font-weight: 600;
            letter-spacing: 0.4px;
        }

        /* --- 뉴모피즘 메뉴 카드 --- */
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            margin-top: 24px;
        }

        .neu-btn {
            background: var(--neu-bg);
            border-radius: 20px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: var(--neu-shadow);
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .neu-btn:hover {
            transform: translateY(-2px);
            box-shadow: 10px 10px 22px var(--neu-dark), -10px -10px 22px var(--neu-light);
        }

        .neu-btn:active {
            transform: translateY(0);
            box-shadow: var(--neu-inset);
        }

        .neu-icon-box {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: var(--neu-bg);
            box-shadow: var(--neu-shadow-sm);
            color: var(--forest-mid);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .neu-btn:active .neu-icon-box {
            box-shadow: var(--neu-inset);
        }

        .neu-text-wrap {
            flex: 1;
            text-align: left;
        }

        .neu-label {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 3px;
        }

        .neu-desc {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .neu-tag {
            font-size: 0.74rem;
            font-weight: 700;
            color: var(--forest-mid);
            background: var(--neu-bg);
            box-shadow: var(--neu-inset);
            padding: 5px 12px;
            border-radius: 999px;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div id="intro-overlay">
    <div class="intro-emblem-wrap" id="intro-emblem">
        <div class="intro-glow"></div>
        <img class="intro-mark" src="Code_Generated_Image.png" alt="마크" onerror="this.src='https://placehold.co/120x120/16402b/c29d38?text=EMBLEM'"[cite: 1]/>
    </div>
    <div class="intro-text" id="intro-caption">ROK ARMY HONOR GUARD</div>
</div>

<div class="app-container">
    <div class="hero-card">
        <div class="unit-pill">
            <span class="unit-pill-dot"></span>
            <span>ROK ARMY HONOR GUARD</span>
        </div>
        <div class="mark-container" id="target-mark-container">
            <img class="mark-img" src="Code_Generated_Image.png" alt="대한민국 육군 의장대 마크" onerror="this.src='https://placehold.co/90x90/16402b/c29d38?text=MARK'"[cite: 1]/>
        </div>
        <h1 class="main-title">의장대에서 살아남기</h1>
        <div class="gold-divider"></div>
        <div class="motto-strip">의식은 전투처럼 훈련은 실전같이</div>
    </div>

    <div class="menu-container">
        <div class="neu-btn">
            <div class="neu-icon-box">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </div>
            <div class="neu-text-wrap">
                <div class="neu-label">생활편</div>
                <div class="neu-desc">관물대·복장·일과·점호</div>
            </div>
            <span class="neu-tag">31개 수칙</span>
        </div>

        <div class="neu-btn">
            <div class="neu-icon-box">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            </div>
            <div class="neu-text-wrap">
                <div class="neu-label">행사/훈련편</div>
                <div class="neu-desc">총기·행사복·군기·행진</div>
            </div>
            <span class="neu-tag">12개 수칙</span>
        </div>

        <div class="neu-btn">
            <div class="neu-icon-box">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
            </div>
            <div class="neu-text-wrap">
                <div class="neu-label">군가편</div>
                <div class="neu-desc">의장대 필수 군가 3곡</div>
            </div>
            <span class="neu-tag">가사 싱크</span>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const overlay = document.getElementById('intro-overlay');
        const introEmblem = document.getElementById('intro-emblem');
        const introCaption = document.getElementById('intro-caption');
        const targetContainer = document.getElementById('target-mark-container');

        setTimeout(() => {
            const startRect = introEmblem.getBoundingClientRect();
            const targetRect = targetContainer.getBoundingClientRect();

            const deltaX = (targetRect.left + targetRect.width / 2) - (startRect.left + startRect.width / 2);
            const deltaY = (targetRect.top + targetRect.height / 2) - (startRect.top + startRect.height / 2);
            const scale = targetRect.width / startRect.width;

            introCaption.style.opacity = '0';
            introEmblem.style.transition = 'transform 0.85s cubic-bezier(0.16, 1, 0.3, 1)';
            introEmblem.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(${scale})`;
            overlay.style.backgroundColor = 'transparent';

            setTimeout(() => {
                document.body.classList.add('intro-finished');
                overlay.style.opacity = '0';
                setTimeout(() => overlay.remove(), 600);
            }, 600);
        }, 1000);
    });
</script>
</body>
</html>
